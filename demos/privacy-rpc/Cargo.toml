[package]
name = "aurora-privacy-rpc-demo"
version = "0.1.0"
edition = "2021"
publish = false

# Keep demo HTTP/browser dependencies out of the EVM's no_std workspace.
[workspace]

[dependencies]
aurora-evm = { path = "../../evm", features = ["privacy"] }
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
primitive-types = { version = "0.13", features = ["rlp"] }
sha3 = "0.10"
hex = "0.4"
rlp = "0.6"
k256 = { version = "=0.13.4", features = ["ecdsa"] }
rand = "0.8"

[profile.dev]
debug = 1
