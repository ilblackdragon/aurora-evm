<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="referrer" content="no-referrer"><title>Private app</title>
<style>body{font:16px system-ui;max-width:760px;margin:50px auto;padding:24px;background:#f5f7fa;color:#152739}input,button{font:inherit;padding:10px;margin:6px 0}input{width:95%}button{cursor:pointer}section{background:white;padding:24px;margin:20px 0;border-radius:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#345}</style>
<h1 id="title">Private app</h1><p>This app can read only the account and token authorized by your app RPC URL.</p>
<section><label>App RPC URL <input id="rpc-url" type="password" autocomplete="off" spellcheck="false"></label><button id="connect">Connect</button> <button id="disconnect">Disconnect</button><p id="status">Disconnected</p><p id="account"></p></section>
<section><h2>Your balance</h2><p id="balance">—</p><button id="refresh">Refresh</button></section>
<section><h2>Your activity</h2><button id="history">Load history</button><pre id="events">[]</pre></section>
<script type="module" src="/app.js"></script></html>
