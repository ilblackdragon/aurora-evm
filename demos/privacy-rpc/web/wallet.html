<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="referrer" content="no-referrer"><title>Private wallet demo</title>
<style>body{font:16px system-ui;max-width:780px;margin:40px auto;padding:24px;background:#f5f7fa;color:#152739}section{background:white;padding:24px;border-radius:12px;margin:16px 0}input,select,button{font:inherit;padding:8px;margin:6px 0}input{width:95%}code,pre{overflow-wrap:anywhere;white-space:pre-wrap}button{cursor:pointer}</style>
<h1>Private wallet demo</h1><p>Local test accounts only. Keep the wallet RPC URL here; share a separate read-only URL with each app.</p>
<section><label>Wallet RPC URL <input id="wallet-url" type="password" autocomplete="off"></label><button id="connect">Connect wallet</button><p id="account">Disconnected</p></section>
<section><h2>Authorize an app</h2><label>App <select id="app"><option value="0">Payments</option><option value="1">Rewards</option></select></label><button id="grant">Create read-only app URL</button><p>Expires in five minutes. Copy into the selected app.</p><code id="grant-url"></code><p><a id="open-app" target="_blank" rel="noreferrer">Open app</a></p><button id="revoke">Revoke this app URL</button></section>
<section><h2>Send test tokens</h2><label>Test private key <input id="key" type="password" autocomplete="off"></label><label>Token <select id="token"><option value="0">Payments token</option><option value="1">Rewards token</option></select></label><label>Recipient <input id="recipient"></label><label>Amount (fixture units) <input id="amount" type="number" min="1" value="10"></label><button id="send">Sign and send transfer</button><pre id="receipt"></pre></section><p id="status"></p>
<script type="module" src="/wallet.js"></script></html>
