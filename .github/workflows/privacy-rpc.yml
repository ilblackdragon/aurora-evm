name: Privacy RPC browser E2E
on:
  pull_request:
  push:
    branches: [master]
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/privacy-rpc/package-lock.json
      - name: Format demo
        run: cargo fmt --manifest-path demos/privacy-rpc/Cargo.toml -- --check
      - name: Lint demo
        run: cargo clippy --manifest-path demos/privacy-rpc/Cargo.toml --all-targets -- -D warnings
      - name: Install browser test dependencies
        working-directory: demos/privacy-rpc
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test two users and two apps against actual RPC and EVM
        working-directory: demos/privacy-rpc
        run: npm test
